# One-command demo: docker compose up --build   then open http://localhost:8081
# Demo accounts: admin@akven.test / changeme-admin and staff@akven.test / changeme-staff (demo profile; switched off once SUPER_ADMIN_EMAIL is set, unless DEMO_ACCOUNTS=on).
# This is for trying and presenting the project (demo mode: demo data, demo accounts, simulated wallet). A real deployment
# sets SPRING_PROFILES_ACTIVE to anything but demo in .env: no demo data or accounts, and no payments until a real provider exists.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: akven
      POSTGRES_USER: akven
      POSTGRES_PASSWORD: ${DB_PASSWORD:-akven}   # set DB_PASSWORD in .env before the first start of a real shop
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akven -d akven"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}   # demo for presenting; prod (or any non-demo value) in .env for a real shop
      DB_URL: jdbc:postgresql://db:5432/akven
      DB_USER: akven
      DB_PASSWORD: ${DB_PASSWORD:-akven}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      NEGOTIATION_PROVIDER: ${NEGOTIATION_PROVIDER:-rule}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      # Real contacts and the super admin come from an ignored .env file next to this one (see .env.example).
      SHOP_CONTACTS: ${SHOP_CONTACTS:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-}
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-off}
    volumes:
      - media:/data/media

  web:
    build: ./frontend
    depends_on:
      - backend
    ports:
      # Only this computer can open the shop. On a server, set AKVEN_BIND=0.0.0.0 (behind HTTPS) to open it to everyone.
      - "${AKVEN_BIND:-127.0.0.1}:8081:80"

volumes:
  dbdata:
  media:
