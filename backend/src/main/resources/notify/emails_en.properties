# Emails to customers, in English. {name} style placeholders; read as UTF-8 by EmailTemplates.
greeting=Hello {name},
signature=AK&VEN · container 70-E, Dordoi Bazaar, Bishkek
questions=Questions? Just reply to this email.
link=Your order: {link}
days={min}–{max} days
days.same={n} days
demo=This was a demo payment: no real money was taken.

confirmed.subject=Order {ref} is confirmed – AK&VEN
confirmed.intro=Thank you! We have your order {ref}, and it is paid.
confirmed.items=What you ordered:
confirmed.item={qty} × {product}, {variant} – {price}
confirmed.delivery=Delivery: {fee}
confirmed.total=Total paid: {total}
confirmed.pickup=Collect it at {place}. Your pickup code is {code}: at the stall, say the code and the last four digits of your phone.
confirmed.hours=Opening hours: {hours}
confirmed.courier=We bring it to: {address} ({zone}, {days}). We will call {phone} before we come.
confirmed.cargo=We hand your parcel to {zone} ({days}) and send you the waybill. You collect it at: {address}
confirmed.cargoOnReceipt=You pay the carrier when you collect the parcel.
confirmed.gift=It is wrapped as a gift, with your card.

handed.subject.PICKUP=Order {ref} is collected – thank you!
handed.PICKUP=You collected order {ref} at the stall. Thank you, and enjoy your socks!
handed.subject.COURIER=Order {ref} is on its way
handed.COURIER=Order {ref} has left the stall and is on its way to {address}. We will call {phone} before we come.
handed.subject.CARGO=Order {ref} is with the carrier
handed.CARGO=We handed order {ref} to {zone}. We send you the waybill, so you can follow the parcel and collect it.

cancelled.subject=Order {ref} is cancelled
cancelled.mine=You cancelled order {ref}.
cancelled.shop=We had to cancel order {ref}. We are sorry. If you have a question, reply to this email.
cancelled.refund=We returned {total} to the card in your {method}. Banks usually show it within a few days.

wholesale.subject=We received your request {ref} – AK&VEN
wholesale.body=Thank you! We received your wholesale request {ref} for about {pairs} pairs. The family answers within one working day, by email to this address.

confirmed.guest=You ordered without an account: the link below opens your order, so keep this email. Anyone with the link can see the order.
orderLink.subject=The link to your order {ref} – AK&VEN
orderLink.body=Here is the link to your order {ref}: {link}
orderLink.notYou=You get this because someone asked for the link with your email and the order's number. If it was not you, nothing has changed and you can ignore this email.
lowStock.subject=Running low after order {ref}
lowStock.intro=Order {ref} has just been paid, and these socks are now at {n} pairs or fewer:
lowStock.item=• {product} ({variant}), {sku}: {left} left
lowStock.incoming=, {n} on the way
lowStock.link=Stock and what is on the way: {link}

reserved.subject=Order {ref} is reserved – AK&VEN
reserved.intro=Thank you! We have put order {ref} aside for you until {until}. You pay when you collect it: in cash or with your bank app, at the stall or to the courier.
reserved.total=To pay at handover: {total}
reserved.nothingPaid=Nothing was paid, so there is nothing to return. The socks are back on the shelf.
expired.subject=Your reservation {ref} has ended
expired.body=We kept order {ref} for you until {until}, but it was not collected, so the socks are back on the shelf. You are welcome to order again at any time.
