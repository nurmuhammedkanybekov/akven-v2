# Demo mode, chosen explicitly (SPRING_PROFILES_ACTIVE=demo): the demo catalog and accounts, and the simulated wallet.
# For presenting and developing the project only; no real money moves.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

akven:
  payments:
    provider: simulated
