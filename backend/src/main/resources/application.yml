server:
  # Behind the web container's nginx, take the visitor's address from X-Forwarded-For (only when the request comes
  # from a private-network proxy), so login and sign-up limits count visitors, not the proxy.
  forward-headers-strategy: native

spring:
  application:
    name: akven-thesis-backend

  # Local development convenience: the `demo` profile loads demo accounts and a demo catalog
  # (application-demo.yml). Anything shared or real must run with SPRING_PROFILES_ACTIVE=prod
  # (or any profile other than demo): no seed data or demo accounts.
  profiles:
    active: demo

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/akven}
    username: ${DB_USER:akven}
    password: ${DB_PASSWORD:akven}

  servlet:
    multipart:
      max-file-size: 5MB      # product photos; MediaStorage enforces the same limit and checks the content
      max-request-size: 6MB

  jpa:
    hibernate:
      ddl-auto: validate   # schema comes from Flyway, not Hibernate auto-generation
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # V2/V4 (demo seed data) live in db/seed and are only loaded by the demo profile. A database that
    # already applied them keeps working when it runs without the demo profile.
    ignore-migration-patterns: "*:missing"

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Never commit real values for these — set via CI/CD variables or a local .env
# that's in .gitignore. See docs/architecture.md, Security section.
akven:
  jwt:
    # Leave JWT_SECRET unset and the shop makes its own random key on first start (kept in its database). Or set a
    # random value of at least 32 bytes (openssl rand -base64 48). A key written in this file is never used.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  auth:
    max-failed-logins: ${AUTH_MAX_FAILED_LOGINS:5}
    lockout-minutes: ${AUTH_LOCKOUT_MINUTES:15}
    max-registrations-per-hour: ${AUTH_MAX_REGISTRATIONS_PER_HOUR:30}   # per client address
  media:
    dir: ${MEDIA_DIR:./data/media}   # uploaded product photos live in <dir>/uploads; back this up
  cors:
    # Comma-separated exact origins; never a wildcard. Default is the Vite dev server.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  negotiation:
    provider: ${NEGOTIATION_PROVIDER:rule}   # rule = deterministic stand-in (default); llm = language model with rule fallback
  llm:
    api-key: ${LLM_API_KEY:}                 # never commit a key: environment variable or an ignored .env file only
    base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}   # any OpenAI-compatible API (Ollama: http://localhost:11434/v1)
    model: ${LLM_MODEL:gemini-3.5-flash-lite}
  shop:
    # The real contacts, "KIND|label|value;..." (see ContactImport). Set in an ignored .env file, never committed.
    contacts: ${SHOP_CONTACTS:}
  super-admin:
    # Creates the super admin on first start of a real installation (see SuperAdminSetup). .env only.
    email: ${SUPER_ADMIN_EMAIL:}
    password: ${SUPER_ADMIN_PASSWORD:}
    name: ${SUPER_ADMIN_NAME:}
  # With a super admin set above, the @akven.test demo accounts are switched off at start; "on" keeps them.
  demo-accounts: ${DEMO_ACCOUNTS:off}
  payments:
    apple-pay-merchant-id: ${APPLE_PAY_MERCHANT_ID:}
    google-pay-merchant-id: ${GOOGLE_PAY_MERCHANT_ID:}
