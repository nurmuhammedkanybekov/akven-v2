<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1050" width="1100" height="1050" font-family="'Liberation Sans', Helvetica, Arial, sans-serif" role="img" aria-label="Three-layer architecture: a React PWA client, a Spring Boot API with Auth, Audit Log, Catalog and Orders, and a Negotiation module whose Negotiator output always passes the Policy Validator, and a PostgreSQL plus pgvector data layer. The LLM provider and the Payment provider are external system actors."><title>Ak&amp;Ven system architecture</title><defs><marker id="m-filled-333333" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L13,7 L0,13 z" fill="#333333"/></marker><marker id="m-filled-5b4b8a" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L13,7 L0,13 z" fill="#5b4b8a"/></marker><marker id="m-filled-b3502f" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L13,7 L0,13 z" fill="#b3502f"/></marker></defs><rect width="1100" height="1050" fill="#ffffff"/><text x="40" y="54" font-size="32" font-weight="700" fill="#2B5A63" text-anchor="start">Ak&amp;Ven — system architecture</text>
<text x="40" y="88" font-size="22" font-weight="400" fill="#555555" text-anchor="start">Three layers, one API, one database</text>
<rect x="40" y="112" width="730" height="172" rx="14" fill="#fafafa" stroke="#d0d0d0" stroke-width="2"/>
<text x="62" y="146" font-size="24" font-weight="700" fill="#2B5A63" text-anchor="start">1  Client layer</text>
<rect x="62" y="158" width="330" height="84" rx="10" fill="#ffffff" stroke="#2B5A63" stroke-width="2.5"/>
<text x="227.0" y="196.0" font-size="23" font-weight="700" fill="#1b1b1b" text-anchor="middle">Customer views</text>
<text x="227.0" y="224.0" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">browse · negotiate · pay</text>
<rect x="410" y="158" width="330" height="84" rx="10" fill="#ffffff" stroke="#2B5A63" stroke-width="2.5"/>
<text x="575.0" y="196.0" font-size="23" font-weight="700" fill="#1b1b1b" text-anchor="middle">Admin &amp; staff views</text>
<text x="575.0" y="224.0" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">catalog · transcripts · audit</text>
<text x="62" y="268" font-size="20" font-weight="400" fill="#555555" text-anchor="start">React PWA — one installable app, role-gated routes</text>
<polyline points="405,290 405,344" fill="none" stroke="#333333" stroke-width="2.2" marker-end="url(#m-filled-333333)" marker-start="url(#m-filled-333333)" stroke-linejoin="round"/>
<text x="424" y="324" font-size="20" font-weight="400" fill="#1b1b1b" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">HTTPS · JSON · JWT</text>
<rect x="40" y="348" width="730" height="330" rx="14" fill="#fafafa" stroke="#d0d0d0" stroke-width="2"/>
<text x="62" y="382" font-size="24" font-weight="700" fill="#2B5A63" text-anchor="start">2  API + negotiation layer</text>
<text x="365.1725" y="382" font-size="21" font-weight="400" fill="#555555" text-anchor="start">Spring Boot · JWT + RBAC</text>
<rect x="62" y="394" width="200" height="84" rx="10" fill="#ffffff" stroke="#2B5A63" stroke-width="2.5"/>
<text x="162.0" y="432.0" font-size="23" font-weight="700" fill="#1b1b1b" text-anchor="middle">Auth</text>
<text x="162.0" y="460.0" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">login · register · me</text>
<rect x="282" y="394" width="210" height="84" rx="10" fill="#ffffff" stroke="#2B5A63" stroke-width="2.5"/>
<text x="387.0" y="432.0" font-size="23" font-weight="700" fill="#1b1b1b" text-anchor="middle">Audit Log</text>
<text x="387.0" y="460.0" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">every admin change</text>
<rect x="512" y="394" width="228" height="84" rx="10" fill="#ffffff" stroke="#2B5A63" stroke-width="2.5"/>
<text x="626.0" y="432.0" font-size="23" font-weight="700" fill="#1b1b1b" text-anchor="middle">Catalog &amp; Orders</text>
<text x="626.0" y="460.0" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">browse · cart · pay</text>
<rect x="62" y="502" width="678" height="160" rx="12" fill="#ffffff" stroke="#2B5A63" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="82" y="534" font-size="23" font-weight="700" fill="#2B5A63" text-anchor="start">Negotiation</text>
<rect x="82" y="558" width="270" height="84" rx="10" fill="#e3f1e7" stroke="#2e7d46" stroke-width="2.5"/>
<text x="217.0" y="596.0" font-size="23" font-weight="700" fill="#1b1b1b" text-anchor="middle">Policy Validator</text>
<text x="217.0" y="624.0" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">clamp to margin floor</text>
<rect x="470" y="558" width="250" height="84" rx="10" fill="#ece8f5" stroke="#5b4b8a" stroke-width="2.5"/>
<text x="595.0" y="596.0" font-size="23" font-weight="700" fill="#1b1b1b" text-anchor="middle">Negotiator</text>
<text x="595.0" y="624.0" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">stand-in (M2) · LLM (M3)</text>
<polyline points="468,600 354,600" fill="none" stroke="#5b4b8a" stroke-width="2.6" marker-end="url(#m-filled-5b4b8a)" stroke-linejoin="round"/>
<text x="411" y="588" font-size="20" font-weight="700" fill="#5b4b8a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">proposal</text>
<polyline points="405,682 405,738" fill="none" stroke="#333333" stroke-width="2.2" marker-end="url(#m-filled-333333)" marker-start="url(#m-filled-333333)" stroke-linejoin="round"/>
<text x="424" y="716" font-size="20" font-weight="400" fill="#1b1b1b" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">JPA · Flyway</text>
<rect x="40" y="742" width="730" height="140" rx="14" fill="#fafafa" stroke="#d0d0d0" stroke-width="2"/>
<text x="62" y="776" font-size="24" font-weight="700" fill="#2B5A63" text-anchor="start">3  Data layer</text>
<rect x="62" y="792" width="678" height="70" rx="10" fill="#ffffff" stroke="#2B5A63" stroke-width="2.5"/>
<text x="401" y="822" font-size="23" font-weight="700" fill="#1b1b1b" text-anchor="middle">PostgreSQL + pgvector</text>
<text x="401" y="848" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">catalog · orders · sessions · audit · embeddings</text>
<rect x="820" y="381" width="240" height="110" rx="10" fill="#f9e9e2" stroke="#b3502f" stroke-width="2.5" stroke-dasharray="9 5"/>
<text x="940" y="417" font-size="23" font-weight="700" fill="#1b1b1b" text-anchor="middle">Payment provider</text>
<text x="940" y="445" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">«external system»</text>
<text x="940" y="473" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">Apple Pay / Google Pay</text>
<rect x="820" y="545" width="240" height="110" rx="10" fill="#f9e9e2" stroke="#b3502f" stroke-width="2.5" stroke-dasharray="9 5"/>
<text x="940" y="581" font-size="23" font-weight="700" fill="#1b1b1b" text-anchor="middle">LLM provider</text>
<text x="940" y="609" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">«external system»</text>
<text x="940" y="637" font-size="20" font-weight="400" font-style="italic" fill="#555555" text-anchor="middle">from Milestone 3</text>
<polyline points="742,436 818,436" fill="none" stroke="#b3502f" stroke-width="2.4" stroke-dasharray="9 6" marker-end="url(#m-filled-b3502f)" marker-start="url(#m-filled-b3502f)" stroke-linejoin="round"/>
<polyline points="722,600 818,600" fill="none" stroke="#b3502f" stroke-width="2.4" stroke-dasharray="9 6" marker-end="url(#m-filled-b3502f)" marker-start="url(#m-filled-b3502f)" stroke-linejoin="round"/>
<text x="40" y="938" font-size="22" font-weight="700" fill="#1b1b1b" text-anchor="start">Legend</text>
<polyline points="160,931 220,931" fill="none" stroke="#333333" stroke-width="2.2" marker-end="url(#m-filled-333333)" marker-start="url(#m-filled-333333)" stroke-linejoin="round"/>
<text x="234" y="938" font-size="20" font-weight="400" fill="#1b1b1b" text-anchor="start">request / response</text>
<polyline points="500,931 560,931" fill="none" stroke="#b3502f" stroke-width="2.2" stroke-dasharray="9 6" marker-end="url(#m-filled-b3502f)" marker-start="url(#m-filled-b3502f)" stroke-linejoin="round"/>
<text x="574" y="938" font-size="20" font-weight="400" fill="#1b1b1b" text-anchor="start">external call</text>
<rect x="160" y="962" width="34" height="22" rx="4" fill="#ece8f5" stroke="#5b4b8a" stroke-width="2"/>
<text x="206" y="980" font-size="20" font-weight="400" fill="#1b1b1b" text-anchor="start">untrusted: model output</text>
<rect x="500" y="962" width="34" height="22" rx="4" fill="#e3f1e7" stroke="#2e7d46" stroke-width="2"/>
<text x="546" y="980" font-size="20" font-weight="400" fill="#1b1b1b" text-anchor="start">trusted: deterministic server code</text>
<text x="40" y="1022" font-size="20" font-weight="400" fill="#555555" text-anchor="start">M2 = Milestone 2 (rule-based stand-in) · M3 = Milestone 3 (LLM + RAG)</text></svg>