<rect x="415.7203125" y="512" width="268.559375" height="25" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="550.0" y="531" font-size="20" font-weight="700" fill="#5b4b8a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">ask(message, price, stock)</text>
<rect x="447.4015625" y="537" width="205.196875" height="25" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="550.0" y="556" font-size="20" font-weight="400" fill="#5b4b8a" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">the floor is never sent</text>
