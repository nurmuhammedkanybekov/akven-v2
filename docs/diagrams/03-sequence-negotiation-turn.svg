<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1230" width="1100" height="1230" font-family="'Liberation Sans', Helvetica, Arial, sans-serif" role="img" aria-label="Sequence of one negotiation turn: the customer&#x27;s message reaches the Negotiation API, which loads the variant, asks the untrusted negotiator for a proposal, has the Policy Validator clamp it to the margin floor, stores both values and replies with the validated discount."><title>One negotiation turn — sequence diagram</title><defs><marker id="m-filled-1b1b1b" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L13,7 L0,13 z" fill="#1b1b1b"/></marker><marker id="m-filled-2B5A63" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L13,7 L0,13 z" fill="#2B5A63"/></marker><marker id="m-filled-2e7d46" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L13,7 L0,13 z" fill="#2e7d46"/></marker><marker id="m-filled-5b4b8a" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L13,7 L0,13 z" fill="#5b4b8a"/></marker><marker id="m-open-1b1b1b" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13" fill="none" stroke="#1b1b1b" stroke-width="2"/></marker><marker id="m-open-2B5A63" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13" fill="none" stroke="#2B5A63" stroke-width="2"/></marker><marker id="m-open-2e7d46" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13" fill="none" stroke="#2e7d46" stroke-width="2"/></marker><marker id="m-open-5b4b8a" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13" fill="none" stroke="#5b4b8a" stroke-width="2"/></marker></defs><rect width="1100" height="1230" fill="#ffffff"/><text x="40" y="54" font-size="30" font-weight="700" fill="#2B5A63" text-anchor="start">One negotiation turn — who talks to whom</text>
<text x="40" y="90" font-size="22" font-weight="400" fill="#555555" text-anchor="start">The proposal is data; only the validator's answer is stored and offered</text>
