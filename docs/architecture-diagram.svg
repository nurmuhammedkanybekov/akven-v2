<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1038" viewBox="0 0 1560 1038" role="img" aria-label="Ak&amp;Ven three-layer architecture: PWA client, Spring Boot API with a Policy Validator gating LLM-proposed discounts before they reach an order, and a single Postgres+pgvector data layer. Payment Provider and LLM Provider are external system actors.">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
  </marker>
</defs>
<rect x="0" y="0" width="1560" height="1038" fill="#f4efe7"/>
<text x="780.0" y="40.0" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Ak&amp;Ven — System Architecture</text><text x="780.0" y="62.0" font-family="Helvetica, Arial, sans-serif" font-size="10.8" font-weight="normal" font-style="normal" fill="#6b6558" text-anchor="middle">3-layer architecture: one PWA client, one Spring Boot API with an embedded margin-safety gate, one Postgres+pgvector store. See docs/architecture.md for the full rationale.</text><rect x="24.0" y="92.0" width="1512.0" height="40.0" rx="6" fill="#fff" stroke="#c9c2b4" stroke-width="1"/><rect x="40.0" y="103.0" width="20.0" height="18.0" rx="4" fill="none" stroke="#2B5A63" stroke-width="2"/><text x="68.0" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">layer boundary</text><rect x="190.0" y="106.0" width="18.0" height="14.0" rx="3" fill="#fff" stroke="#1a1a1a" stroke-width="1.3"/><text x="215.0" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">internal component</text><rect x="365.0" y="106.0" width="18.0" height="14.0" rx="3" fill="#fff" stroke="#b3502f" stroke-width="1.3" stroke-dasharray="3,2"/><text x="390.0" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">external system actor</text><rect x="560.0" y="106.0" width="18.0" height="14.0" rx="3" fill="#fff" stroke="#5b4b8a" stroke-width="1.3" stroke-dasharray="3,2"/><text x="585.0" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">margin-safety gate</text><line x1="750.0" y1="113.0" x2="784.0" y2="113.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="792.0" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">call / persist</text><line x1="895.0" y1="113.0" x2="929.0" y2="113.0" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/><text x="937.0" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">external call (async)</text><line x1="1090.0" y1="113.0" x2="1124.0" y2="113.0" stroke="#6b6558" stroke-width="1.2" stroke-dasharray="1,3"/><text x="1132.0" y="115.0" font-family="Helvetica, Arial, sans-serif" font-size="9.2" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">read-only reference</text><rect x="60.0" y="164.0" width="1440.0" height="130.0" rx="12" fill="none" stroke="#2B5A63" stroke-width="2"/><rect x="76.0" y="152.0" width="525.6" height="22.0" rx="6" fill="#f4efe7" stroke="#2B5A63" stroke-width="1.6"/><text x="338.8" y="167.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#2B5A63" text-anchor="middle">1 · CLIENT LAYER — single installable PWA, role-gated routes (NFR-9, NFR-11)</text><rect x="100.0" y="192.0" width="660.0" height="84.0" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="430.0" y="228.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Customer views</text><text x="110.0" y="244.0" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" font-style="normal" fill="#6b6558" text-anchor="start">Catalog, product, cart &amp; checkout, negotiate chat. Phone (browser + installed), tablet, laptop.</text><text x="430.0" y="268.0" font-family="Helvetica, Arial, sans-serif" font-size="7.8" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">FR-1–FR-8</text><rect x="800.0" y="192.0" width="660.0" height="84.0" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="1130.0" y="228.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Admin / Staff views</text><text x="810.0" y="244.0" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" font-style="normal" fill="#6b6558" text-anchor="start">Catalog mgmt, negotiation transcripts, audit log, users. Same app, gated by role — not a separate system.</text><text x="1130.0" y="268.0" font-family="Helvetica, Arial, sans-serif" font-size="7.8" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">FR-9–FR-14</text><line x1="430.0" y1="294.0" x2="430.0" y2="340.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="1130.0" y1="294.0" x2="1130.0" y2="340.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="780.0" y="321.0" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">JWT bearer token</text><rect x="60.0" y="340.0" width="1440.0" height="400.0" rx="12" fill="none" stroke="#1a1a1a" stroke-width="2"/><rect x="76.0" y="328.0" width="644.4" height="22.0" rx="6" fill="#f4efe7" stroke="#1a1a1a" stroke-width="1.6"/><text x="398.2" y="343.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">2 · API + NEGOTIATION LAYER — Spring Boot · JWT + RBAC: CUSTOMER / STAFF / ADMIN (FR-9, NFR-2)</text><rect x="100.0" y="396.0" width="346.7" height="76.0" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="273.3" y="428.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Catalog &amp; Orders</text><text x="110.0" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" font-style="normal" fill="#6b6558" text-anchor="start">Browse, cart, checkout via tokenized Apple/Google Pay.</text><text x="273.3" y="464.0" font-family="Helvetica, Arial, sans-serif" font-size="7.8" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">FR-1,2,7,8,10,11</text><rect x="476.7" y="396.0" width="346.7" height="76.0" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="650.0" y="428.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Negotiation</text><text x="486.7" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" font-style="normal" fill="#6b6558" text-anchor="start">Calls the LLM with RAG context; never negotiates from model knowledge</text><text x="486.7" y="455.5" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" font-style="normal" fill="#6b6558" text-anchor="start">alone.</text><text x="650.0" y="464.0" font-family="Helvetica, Arial, sans-serif" font-size="7.8" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">FR-3,4,6 / NFR-3</text><rect x="853.3" y="396.0" width="346.7" height="76.0" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="1.6"/><text x="1026.7" y="428.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#1a1a1a" text-anchor="middle">Audit Log</text><text x="863.3" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" font-style="normal" fill="#6b6558" text-anchor="start">One row per admin/staff mutation, before/after state.</text><text x="1026.7" y="464.0" font-family="Helvetica, Arial, sans-serif" font-size="7.8" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">FR-13,14 / NFR-7</text><polyline points="273.3,396.0 273.3,380.0 1026.7,380.0 1026.7,396.0" fill="none" stroke="#6b6558" stroke-width="1.1" stroke-dasharray="1,3" marker-end="url(#arrow)"/><text x="650.0" y="375.0" font-family="Helvetica, Arial, sans-serif" font-size="7.3" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">records mutation</text><rect x="1240.0" y="396.0" width="220.0" height="60.0" rx="8" fill="#fff" stroke="#b3502f" stroke-width="1.6" stroke-dasharray="5,3"/><text x="1350.0" y="422.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#b3502f" text-anchor="middle">LLM Provider</text><text x="1350.0" y="437.0" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" font-style="italic" fill="#b3502f" text-anchor="middle">«system actor»</text><text x="1350.0" y="448.0" font-family="Helvetica, Arial, sans-serif" font-size="7.8" font-weight="normal" font-style="normal" fill="#6b6558" text-anchor="middle">provider TBD — open dependency (§7)</text><polyline points="650.0,396.0 650.0,362.0 1350.0,362.0 1350.0,396.0" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/><text x="1000.0" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="7.6" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">RAG query ↔ proposed discount (untrusted)</text><rect x="461.7" y="502.0" width="376.7" height="60.0" rx="8" fill="#fff" stroke="#5b4b8a" stroke-width="1.8" stroke-dasharray="5,3"/><text x="650.0" y="522.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#5b4b8a" text-anchor="middle">Policy Validator</text><text x="650.0" y="536.0" font-family="Helvetica, Arial, sans-serif" font-size="7.6" font-weight="normal" font-style="normal" fill="#6b6558" text-anchor="middle">clamps → min(proposed, marginFloorPct)</text><text x="650.0" y="549.0" font-family="Helvetica, Arial, sans-serif" font-size="7.4" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">the ONLY code allowed to touch an order&#x27;s price (FR-5)</text><line x1="634.0" y1="472.0" x2="634.0" y2="502.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="628.0" y="487.0" font-family="Helvetica, Arial, sans-serif" font-size="7.3" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="end">proposed</text><line x1="666.0" y1="502.0" x2="666.0" y2="472.0" stroke="#2e7d46" stroke-width="1.5" marker-end="url(#arrow)"/><text x="672.0" y="487.0" font-family="Helvetica, Arial, sans-serif" font-size="7.3" font-weight="normal" font-style="italic" fill="#2e7d46" text-anchor="start">validated</text><polyline points="461.7,532.0 447.7,532.0 447.7,582.0 273.3,582.0 273.3,472.0" fill="none" stroke="#6b6558" stroke-width="1.1" stroke-dasharray="1,3" marker-end="url(#arrow)"/><text x="360.5" y="576.0" font-family="Helvetica, Arial, sans-serif" font-size="7.3" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">reads marginFloorPct</text><rect x="1240.0" y="578.0" width="220.0" height="60.0" rx="8" fill="#fff" stroke="#b3502f" stroke-width="1.6" stroke-dasharray="5,3"/><text x="1350.0" y="604.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#b3502f" text-anchor="middle">Payment Provider</text><text x="1350.0" y="619.0" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" font-style="italic" fill="#b3502f" text-anchor="middle">«system actor»</text><text x="1350.0" y="630.0" font-family="Helvetica, Arial, sans-serif" font-size="7.8" font-weight="normal" font-style="normal" fill="#6b6558" text-anchor="middle">Apple Pay / Google Pay — tokenized only</text><polyline points="273.3,472.0 273.3,608.0 1240.0,608.0" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow)"/><text x="756.7" y="600.0" font-family="Helvetica, Arial, sans-serif" font-size="7.6" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">tokenized payment req / confirmation</text><line x1="273.3" y1="740.0" x2="273.3" y2="786.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="650.0" y1="740.0" x2="650.0" y2="786.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="1026.7" y1="740.0" x2="1026.7" y2="786.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="650.0" y="767.0" font-family="Helvetica, Arial, sans-serif" font-size="8" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">JPA / Flyway-managed schema</text><rect x="60.0" y="786.0" width="1440.0" height="130.0" rx="12" fill="none" stroke="#6b6a3f" stroke-width="2"/><rect x="76.0" y="774.0" width="637.8" height="22.0" rx="6" fill="#f4efe7" stroke="#6b6a3f" stroke-width="1.6"/><text x="394.9" y="789.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="bold" font-style="normal" fill="#6b6a3f" text-anchor="middle">3 · DATA / ML LAYER — one PostgreSQL instance + pgvector extension (no separate vector store)</text><rect x="100.0" y="826.0" width="213.3" height="62.0" rx="8" fill="#fff" stroke="#6b6a3f" stroke-width="1.3"/><text x="108.0" y="848.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">Product / Variant</text><text x="206.7" y="878.0" font-family="Helvetica, Arial, sans-serif" font-size="7.3" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">FR-1,10,11</text><rect x="329.3" y="826.0" width="213.3" height="62.0" rx="8" fill="#fff" stroke="#6b6a3f" stroke-width="1.3"/><text x="337.3" y="848.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">Order / OrderItem</text><text x="436.0" y="878.0" font-family="Helvetica, Arial, sans-serif" font-size="7.3" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">FR-7,8</text><rect x="558.7" y="826.0" width="213.3" height="62.0" rx="8" fill="#fff" stroke="#6b6a3f" stroke-width="1.3"/><text x="566.7" y="848.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">NegotiationSession</text><text x="665.3" y="878.0" font-family="Helvetica, Arial, sans-serif" font-size="7.3" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">FR-3–6</text><rect x="788.0" y="826.0" width="213.3" height="62.0" rx="8" fill="#fff" stroke="#6b6a3f" stroke-width="1.3"/><text x="796.0" y="848.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">User</text><text x="894.7" y="878.0" font-family="Helvetica, Arial, sans-serif" font-size="7.3" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">FR-9</text><rect x="1017.3" y="826.0" width="213.3" height="62.0" rx="8" fill="#fff" stroke="#6b6a3f" stroke-width="1.3"/><text x="1025.3" y="848.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">AuditLogEntry</text><text x="1124.0" y="878.0" font-family="Helvetica, Arial, sans-serif" font-size="7.3" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">FR-13,14</text><rect x="1246.7" y="826.0" width="213.3" height="62.0" rx="8" fill="#fff" stroke="#6b6a3f" stroke-width="1.3"/><text x="1254.7" y="848.0" font-family="Helvetica, Arial, sans-serif" font-size="8.6" font-weight="normal" font-style="normal" fill="#1a1a1a" text-anchor="start">product_embedding (vector)</text><text x="1353.3" y="878.0" font-family="Helvetica, Arial, sans-serif" font-size="7.3" font-weight="normal" font-style="italic" fill="#6b6558" text-anchor="middle">RAG, Phase 2</text><rect x="24.0" y="952.0" width="1512.0" height="56.0" rx="6" fill="#fff" stroke="#c9c2b4" stroke-width="1"/><text x="40.0" y="972.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" font-weight="normal" font-style="normal" fill="#6b6558" text-anchor="start">The mechanism that matters: the LLM never sets a price. It proposes a discount as data; Policy Validator is the only code allowed to turn that proposal into something that</text><text x="40.0" y="983.5" font-family="Helvetica, Arial, sans-serif" font-size="8.8" font-weight="normal" font-style="normal" fill="#6b6558" text-anchor="start">touches an order, deterministically and independent of the model call — immune to prompt injection by construction. NegotiationSession logs both numbers separately, which is</text><text x="40.0" y="995.0" font-family="Helvetica, Arial, sans-serif" font-size="8.8" font-weight="normal" font-style="normal" fill="#6b6558" text-anchor="start">the visible defense evidence (see architecture.md).</text>
</svg>