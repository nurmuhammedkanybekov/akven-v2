name: CI

on:
  push:
    branches: ["**"]   # every branch: feature branches were silently skipped before
  pull_request:

jobs:
  # Fast feedback: unit + MockMvc tests on H2 (same as `mvn test` locally).
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # `verify` = tests + the JaCoCo gate (fails below 80% line coverage).
      - name: mvn verify
        run: mvn -B verify
      - name: Upload surefire reports and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/

  # Frontend: types, unit tests (including the WCAG contrast check of the design tokens) and a production build.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  # Integration tests on real PostgreSQL 16 + pgvector: Flyway V1-V6, Hibernate schema validation,
  # role rules on a real server, jsonb audit rows, database CHECK constraints.
  backend-postgres-it:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: akven_it
          POSTGRES_USER: akven
          POSTGRES_PASSWORD: akven
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akven -d akven_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AKVEN_PG_URL: jdbc:postgresql://localhost:5432/akven_it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: PostgresIntegrationTest
        working-directory: backend
        run: mvn -B test -Dtest=PostgresIntegrationTest

  # The part H2 cannot prove: Flyway migrations + pgvector + pgcrypto on real
  # PostgreSQL, Hibernate schema validation, and that a bcrypt hash written by
  # pgcrypto's crypt() is accepted by Spring's BCryptPasswordEncoder.
  backend-postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: akven
          POSTGRES_USER: akven
          POSTGRES_PASSWORD: akven
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akven -d akven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/akven
      DB_USER: akven
      DB_PASSWORD: akven
      JWT_SECRET: ci-only-secret-0123456789-0123456789-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build jar
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Boot the app against real PostgreSQL
        run: |
          nohup java -jar backend/target/*-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "app is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "app did not become healthy"; cat app.log; exit 1
      - name: Smoke test — seeded admin can log in and use the token
        run: |
          set -e
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@akven.test","password":"changeme-admin"}' | jq -r .token)
          test -n "$TOKEN" -a "$TOKEN" != "null"
          ROLE=$(curl -fsS http://localhost:8080/api/auth/me -H "Authorization: Bearer $TOKEN" | jq -r .role)
          echo "role from /me: $ROLE"; test "$ROLE" = "ADMIN"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/me)
          echo "anonymous /me -> $CODE"; test "$CODE" = "401"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' -d '{"email":"admin@akven.test","password":"wrong-password"}')
          echo "wrong password -> $CODE"; test "$CODE" = "401"
          curl -fsS http://localhost:8080/api/products > /dev/null
      - name: Show app log on failure
        if: failure()
        run: cat app.log

  # The owner's workflow in a real browser against the real stack: PostgreSQL, the Spring backend, the built frontend.
  # Sign in, add a section, add a product with colours, upload a photo, see it in the shop, remove and restore it.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: akven
          POSTGRES_USER: akven
          POSTGRES_PASSWORD: akven
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akven -d akven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/akven
      DB_USER: akven
      DB_PASSWORD: akven
      JWT_SECRET: ci-only-secret-0123456789-0123456789-0123456789
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      MEDIA_DIR: /tmp/akven-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the backend
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Start the backend
        run: |
          nohup java -jar backend/target/*-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then echo "backend is up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "backend did not become healthy"; cat app.log; exit 1
      - name: Build the frontend and install a browser
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright-core install --with-deps chromium
      - name: Run the end-to-end check
        working-directory: frontend
        run: npm run e2e
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: docs/design/
      - name: Show the backend log on failure
        if: failure()
        run: cat app.log
