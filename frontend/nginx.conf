# Pass on the scheme a TLS proxy in front of this one saw; without such a proxy, our own.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://backend:8080;
    # $http_host keeps the port (localhost:8081), so the backend sees the browser's own origin and the request is
    # same-origin. With $host the port is lost and every POST (sign-in, checkout) is refused as a cross-site request.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Only the headers above describe the visitor; anything else a client sends with these names is dropped.
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    client_max_body_size 6m;      # photo uploads are limited to 5 MB by the backend
  }
  location /media/uploads/ {
    proxy_pass http://backend:8080;
  }
  # The service worker must always be re-checked so a new release reaches visitors.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location / {
    try_files $uri /index.html;   # single-page app: every route is served by index.html
  }
}
