# Minimal CI now; grows into the Milestone 3 requirement (CI/CD running,
# >80% test coverage on the model layer) as the negotiation module lands.
stages:
  - test

backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  cache:
    key:
      files:
        - backend/pom.xml
    paths:
      - .m2/repository
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  script:
    - cd backend
    - mvn $MAVEN_OPTS -B test
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
  rules:
    - changes:
        - backend/**/*
